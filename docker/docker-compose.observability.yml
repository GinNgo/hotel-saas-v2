# ═══════════════════════════════════════════════════════════════════════════
# Hotel SaaS Platform v2 — Centralized Observability Stack (PLG Stack)
#   1. Prometheus (Metrics Scraping & Alert Evaluation)
#   2. Loki (Centralized Structured JSON Log Aggregation)
#   3. Promtail (Docker Container Log Shipper with Tenant/Property Labels)
#   4. Grafana (Unified Dashboards for API, Multi-Tenant Security, SignalR & VNPay)
# ═══════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker/docker-compose.full.yml -f docker/docker-compose.observability.yml up -d
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── 1. Prometheus Time-Series Metrics & Alerting ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hotelsaas-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - hotelsaas-net

  # ── 2. Grafana Loki — Centralized Structured Log Store ───────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: hotelsaas-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks:
      - hotelsaas-net

  # ── 3. Promtail — Container Structured Log Collector ─────────────────────
  promtail:
    image: grafana/promtail:3.1.1
    container_name: hotelsaas-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - hotelsaas-net

  # ── 4. Grafana — Unified SRE & Security Visualization ────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: hotelsaas-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-HotelSaasMonitor2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - hotelsaas-net

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

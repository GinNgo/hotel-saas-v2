apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki (Structured Logs)
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: CorrelationIdJson
          matcherRegex: '"CorrelationId":"([^"]+)"'
          datasourceUid: loki
          url: '{container=~".+"} |= "$${__value.raw}"'
          urlDisplayLabel: 'Truy vết Request (JSON)'
        - name: CorrelationIdLine
          matcherRegex: 'Mã:\s*([A-Za-z0-9_-]+)'
          datasourceUid: loki
          url: '{container=~".+"} |= "$${__value.raw}"'
          urlDisplayLabel: 'Truy vết Request'

apiVersion: 1

providers:
  - name: 'HotelSaas SRE & Security Dashboards'
    orgId: 1
    folder: 'Hotel SaaS Platform'
    folderUid: 'hotelsaas-sre'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

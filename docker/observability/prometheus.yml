global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    platform: 'hotel-saas-v2'

rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  - job_name: 'hotelsaas-backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: 'HotelSaas.WebApi'
          layer: 'backend'

groups:
  - name: hotelsaas_security_and_sre_alerts
    interval: 15s
    rules:
      # 1. Cross-Tenant / Cross-Branch Isolation Violation Spike
      - alert: MultiTenantIsolationViolationSpike
        expr: increase(hotelsaas_tenant_isolation_blocks_total[5m]) > 10
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Phát hiện đột biến truy cập trái phép liên Tenant / liên Chi nhánh"
          description: "Có hơn 10 request vi phạm ranh giới Tenant/Property bị chặn bởi Fail-Closed Guard trong 5 phút qua."

      # 2. VNPay Checksum Tampering Alert
      - alert: VnpaySignatureTamperDetected
        expr: increase(hotelsaas_vnpay_ipn_total{rsp_code="97"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: payment_security
        annotations:
          summary: "Cảnh báo giả mạo chữ ký HMAC-SHA512 trên VNPay IPN Webhook"
          description: "Hệ thống ghi nhận gói tin IPN có chữ ký vnp_SecureHash không hợp lệ (RspCode=97)."

      # 3. Backend HTTP 5xx Error Rate Alert
      - alert: BackendHigh5xxErrorRate
        expr: increase(hotelsaas_http_5xx_errors_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Tỷ lệ lỗi HTTP 5xx trên HotelSaas.WebApi vượt ngưỡng"
          description: "Ghi nhận hơn 5 lỗi máy chủ nội bộ (5xx) trong vòng 5 phút."

      # 4. Backend Service Down Alert
      - alert: HotelSaasBackendDown
        expr: up{job="hotelsaas-backend-api"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Dịch vụ API Backend HotelSaas ngừng phản hồi"
          description: "Prometheus không thể thu thập metrics từ HotelSaas.WebApi (job=hotelsaas-backend-api) trong hơn 1 phút liên tiếp."

      # 5. High HTTP Latency (P95 > 1.5s) Alert
      - alert: HotelSaasHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(hotelsaas_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Độ trễ API P95 trên HotelSaas.WebApi vượt quá 1.5 giây"
          description: "95% yêu cầu API có thời gian phản hồi vượt ngưỡng 1.5s kéo dài trong 5 phút gần nhất. Kiểm tra cơ sở dữ liệu và tài nguyên VPS."

      # 6. SePay VietQR Webhook Failure Spike Alert
      - alert: HotelSaasSepayWebhookFailures
        expr: sum(increase(hotelsaas_sepay_webhook_total{status=~"auth_failed|rejected_unconfigured_bank_account|error"}[10m])) > 3
        for: 0m
        labels:
          severity: critical
          category: payment_security
        annotations:
          summary: "Phát hiện nhiều lỗi xử lý SePay VietQR Webhook"
          description: "Ghi nhận hơn 3 sự kiện SePay Webhook thất bại (auth_failed, rejected_unconfigured_bank_account hoặc error) trong vòng 10 phút."

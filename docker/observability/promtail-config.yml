server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: hotelsaas-docker-json-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: Level
            correlation_id: Properties.CorrelationId
            tenant_id: Properties.TenantId
            property_id: Properties.PropertyId
            status_code: Properties.StatusCode
            elapsed_ms: Properties.ElapsedMs
      - labels:
          level:
          tenant_id:
          property_id:

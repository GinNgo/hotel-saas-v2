# ═══════════════════════════════════════════════════════════════════════════
# Hotel SaaS Platform v2 — Automated VPS Deployment Pipeline (CD + Rollback)
# ═══════════════════════════════════════════════════════════════════════════
# Quy trình chuẩn Enterprise:
#   - Khi push lên `develop`: Chạy Stage 1 (Isolation Gate) và Stage 2 (Build Test)
#     để bảo đảm code sạch, KHÔNG tác động tới VPS.
#   - Khi merge vào `main`: Tự động kích hoạt Stage 3 (Rolling Deploy lên VPS)
# ═══════════════════════════════════════════════════════════════════════════

name: CD — Deploy to Production VPS

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ginngo/hotel-saas-backend
  FRONTEND_IMAGE: ghcr.io/ginngo/hotel-saas-frontend
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Stage 1: Automated Multi-Tenant Isolation Gate ──────────────────────
  isolation-gate:
    name: 1. Multi-Tenant & Branch Isolation Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel_saas_p1b01a_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Multi-Tenant, Cross-Branch, SignalR, Payment & Security Isolation Tests
        working-directory: backend
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=hotel_saas_p1b01a_test;Username=postgres;Password=postgres;Persist Security Info=true;Pooling=false;"
        run: |
          dotnet test HotelSaas.slnx \
            --configuration Release \
            --filter "FullyQualifiedName~MultiTenantBranchIsolationTests|FullyQualifiedName~TenantPropertyContextMiddlewareTests|FullyQualifiedName~NotificationHubSecurityTests|FullyQualifiedName~VnpayIntegrationTests|FullyQualifiedName~SepayWebhookTests|FullyQualifiedName~Wave10SecurityHardeningTests|FullyQualifiedName~ObservabilityMetricsAndLoggingTests" \
            --logger "trx;LogFileName=isolation-gate.trx"

  # ── Stage 2: Build & Push Immutable Docker Images ──────────────────────
  build-and-push:
    name: 2. Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    needs: [isolation-gate]
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Immutable Image Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend (.NET 10 WebApi)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend (Angular 22 + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ── Stage 3: Deploy to VPS via Zero-Downtime Rolling Update ─────────────
  # CHỈ KÍCH HOẠT KHI MERGE VÀO NHÁNH MAIN HOẶC TRIGGER BẰNG TAY
  deploy-vps:
    name: 3. Rolling Deploy to VPS (Chỉ kích hoạt khi vào main)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Checkout observability & reverse proxy configs
        uses: actions/checkout@v4

      - name: Sync observability configs & Caddyfile to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker/docker-compose.observability.yml,docker/observability/,deploy/Caddyfile,deploy/docker-compose.staging.override.yml"
          target: "/opt/hotel-saas"

      - name: Execute Rolling Update on VPS
        uses: appleboy/ssh-action@v1.1.0
        env:
          SEPAY_API_KEY: ${{ secrets.SEPAY_API_KEY }}
          SEPAY_PLATFORM_BANK_NAME: ${{ secrets.SEPAY_PLATFORM_BANK_NAME }}
          SEPAY_PLATFORM_ACCOUNT: ${{ secrets.SEPAY_PLATFORM_ACCOUNT }}
          SEPAY_PLATFORM_ACCOUNT_HOLDER: ${{ secrets.SEPAY_PLATFORM_ACCOUNT_HOLDER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: SEPAY_API_KEY,SEPAY_PLATFORM_BANK_NAME,SEPAY_PLATFORM_ACCOUNT,SEPAY_PLATFORM_ACCOUNT_HOLDER,SMTP_USERNAME,SMTP_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/hotel-saas

            read_env_value() {
              local key="$1"
              local file="${2:-.env}"
              if [ ! -f "${file}" ]; then
                return 0
              fi
              local line
              line=$(grep -E "^[[:space:]]*(export[[:space:]]+)?${key}=" "${file}" | tail -n 1 || true)
              if [ -z "${line}" ]; then
                return 0
              fi
              local val="${line#*=}"
              val="${val%$'\r'}"
              val="${val#\"}"
              val="${val%\"}"
              val="${val#\'}"
              val="${val%\'}"
              printf '%s' "${val}"
            }

            upsert_env_value() {
              local key="$1"
              local val="$2"
              local file="${3:-.env}"
              local tmp
              tmp="$(mktemp)"
              if [ -f "${file}" ]; then
                grep -vE "^[[:space:]]*(export[[:space:]]+)?${key}=" "${file}" > "${tmp}" || true
              fi
              case "${val}" in
                *[[:space:]]*)
                  printf '%s="%s"\n' "${key}" "${val}" >> "${tmp}"
                  ;;
                *)
                  printf '%s=%s\n' "${key}" "${val}" >> "${tmp}"
                  ;;
              esac
              mv "${tmp}" "${file}"
            }

            sync_metrics_key_file() {
              local key_file="$1"
              local key_value="$2"
              local key_dir
              key_dir="$(dirname "${key_file}")"

              if [ "$(id -u)" -eq 0 ] || [ -w "${key_dir}" ]; then
                mkdir -p "${key_dir}"
                printf '%s' "${key_value}" > "${key_file}"
                chmod 644 "${key_file}"
              else
                sudo mkdir -p "${key_dir}"
                printf '%s' "${key_value}" | sudo tee "${key_file}" >/dev/null
                sudo chmod 644 "${key_file}"
              fi
            }

            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            if [ -z "$IMAGE_TAG" ]; then
              echo "❌ IMAGE_TAG is empty; refusing to deploy bare :latest!"
              exit 1
            fi

            echo "[0/6] Ensuring VPS .env hygiene (JWT secret & SePay/SMTP sync)..."
            touch .env
            cp .env .env.bak
            CURRENT_JWT="$(read_env_value JWT_SECRET_KEY .env)"
            LOWER_JWT="$(printf '%s' "${CURRENT_JWT}" | tr '[:upper:]' '[:lower:]')"
            if [ -z "${CURRENT_JWT}" ] || [ "${#CURRENT_JWT}" -lt 32 ] || \
               [ "${CURRENT_JWT}" = "DevOnly_SuperSecretKey_ChangeInProduction_AtLeast32Chars!" ] || \
               [ "${CURRENT_JWT}" = "HotelSaasPlatform2026EnterpriseSuperSecretKey32BytesLong!" ] || \
               [ "${CURRENT_JWT}" = "YourSuperSecretKeyMustBeAtLeast32CharactersLongForJwt!" ] || \
               printf '%s' "${LOWER_JWT}" | grep -qE 'devonly|changeinproduction'; then
              NEW_JWT="$(openssl rand -base64 48 | tr -d '\n')"
              upsert_env_value JWT_SECRET_KEY "${NEW_JWT}" .env
              echo "✔ Rotated placeholder JWT_SECRET_KEY on VPS (.env backed up to .env.bak)"
            fi

            [ -n "${SEPAY_API_KEY:-}" ] && upsert_env_value SEPAY_API_KEY "${SEPAY_API_KEY}" .env
            [ -n "${SEPAY_PLATFORM_BANK_NAME:-}" ] && upsert_env_value SEPAY_PLATFORM_BANK_NAME "${SEPAY_PLATFORM_BANK_NAME}" .env
            [ -n "${SEPAY_PLATFORM_ACCOUNT:-}" ] && upsert_env_value SEPAY_PLATFORM_ACCOUNT "${SEPAY_PLATFORM_ACCOUNT}" .env
            [ -n "${SEPAY_PLATFORM_ACCOUNT_HOLDER:-}" ] && upsert_env_value SEPAY_PLATFORM_ACCOUNT_HOLDER "${SEPAY_PLATFORM_ACCOUNT_HOLDER}" .env
            [ -n "${SMTP_USERNAME:-}" ] && upsert_env_value SMTP_USERNAME "${SMTP_USERNAME}" .env
            [ -n "${SMTP_PASSWORD:-}" ] && upsert_env_value SMTP_PASSWORD "${SMTP_PASSWORD}" .env
            chmod 600 .env .env.bak

            echo "[1/6] Authenticating Docker with GHCR on VPS..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "[2/6] Pulling immutable images (${IMAGE_TAG}) from GHCR..."
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.staging.yml pull

            echo "[3/6] Gracefully rolling update backend & frontend containers (${IMAGE_TAG})..."
            if [ -f deploy/docker-compose.staging.override.yml ]; then
              IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.staging.yml -f deploy/docker-compose.staging.override.yml up -d --no-deps backend frontend
            else
              IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.staging.yml up -d --no-deps backend frontend
            fi

            echo "[4/6] Deploying observability stack (if GF_SECURITY_ADMIN_PASSWORD is configured)..."
            if [ -f docker/docker-compose.observability.yml ]; then
              EFFECTIVE_GF_PASSWORD="${GF_SECURITY_ADMIN_PASSWORD:-$(read_env_value GF_SECURITY_ADMIN_PASSWORD .env)}"
              EFFECTIVE_METRICS_KEY="${METRICS_API_KEY:-$(read_env_value METRICS_API_KEY .env)}"
              METRICS_KEY_FILE="${PROMETHEUS_METRICS_KEY_FILE:-$(read_env_value PROMETHEUS_METRICS_KEY_FILE .env)}"
              METRICS_KEY_FILE="${METRICS_KEY_FILE:-/etc/hotelsaas/metrics_api_key}"

              if [ -z "${EFFECTIVE_GF_PASSWORD}" ]; then
                echo "ℹ️ Skipping observability stack deploy: GF_SECURITY_ADMIN_PASSWORD is not set in /opt/hotel-saas/.env."
              else
                if [ -n "${EFFECTIVE_METRICS_KEY}" ]; then
                  sync_metrics_key_file "${METRICS_KEY_FILE}" "${EFFECTIVE_METRICS_KEY}"
                  echo "✔ Synced Prometheus metrics key file: ${METRICS_KEY_FILE} (mode 644)"
                elif [ ! -f "${METRICS_KEY_FILE}" ]; then
                  sync_metrics_key_file "${METRICS_KEY_FILE}" ""
                  echo "⚠️ METRICS_API_KEY not set in .env; initialized empty ${METRICS_KEY_FILE} so Prometheus can start."
                fi

                if [ -f .env ]; then
                  docker compose --env-file .env -f docker/docker-compose.observability.yml up -d
                else
                  docker compose -f docker/docker-compose.observability.yml up -d
                fi
              fi
            fi

            echo "[5/6] Reloading Caddy reverse proxy gracefully (if running)..."
            if docker ps --format '{{.Names}}' | grep -qx 'hotelsaas-caddy'; then
              docker exec hotelsaas-caddy caddy reload --config /etc/caddy/Caddyfile || echo "⚠️ Caddy reload returned non-zero (continuing to health verification)"
            fi

            echo "[6/6] Verifying health probes..."
            HEALTHY=0
            for i in $(seq 1 20); do
              if curl -sk https://luxustay.duckdns.org/health | grep -q '"status":"healthy"'; then
                READY_CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://luxustay.duckdns.org/health/ready || echo "000")
                if [ "$READY_CODE" = "200" ]; then
                  HEALTHY=1
                  break
                fi
              fi
              echo "Waiting for health check probe ($i/20)..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Health check (/health & /health/ready) failed after 60 seconds!"
              docker logs --tail 80 hotelsaas-backend-api
              exit 1
            fi

            echo "✅ Hotel SaaS Platform deployment verified (/health & /health/ready == 200)!"

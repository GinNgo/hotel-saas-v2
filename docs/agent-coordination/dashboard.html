<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel SaaS · Agent Board</title>
<style>body{margin:0;background:#f4f7fb;color:#172636;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}article{background:white;border:1px solid #dde5ed;border-radius:16px;padding:20px;margin-bottom:16px}small{color:#536579}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#087766}button{padding:10px 16px;border:0;border-radius:8px;background:#087766;color:white}#error{color:#a32b2b}</style></head>
<body><main><h1>Hotel SaaS · Bảng phối hợp agent</h1><p>Mailbox local · tự tải lại mỗi 10 giây · không phải live process monitor</p><p id="error" role="status"></p><div id="board"></div><button id="refresh">Làm mới</button><p><a href="submission.md">Submission</a> · <a href="review.md">Review</a> · <a href="decisions.md">Cần PO</a> · <a href="README.md">Hướng dẫn kết nối</a></p><small id="checked"></small></main>
<script>
const board=document.getElementById('board');
function card(title,content){const panel=document.createElement('article');const heading=document.createElement('h2');heading.textContent=title;const body=document.createElement('pre');body.textContent=content;panel.append(heading,body);return panel}
function agentText(agent){const stamp=Date.parse(agent.heartbeatAt);const recent=Number.isFinite(stamp)&&Date.now()-stamp<1800000;return `Trạng thái báo: ${agent.status}\nHeartbeat: ${agent.heartbeatAt||'chưa có'}\nHoạt động: ${recent?'có cập nhật gần đây (không xác nhận process)':'chưa xác nhận / quá hạn'}\nPhiên: ${agent.sessionLink||'runtime chưa cung cấp'}`}
async function refresh(){try{const response=await fetch('task.json',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);const task=await response.json();board.replaceChildren();board.append(card(`${task.taskId} · vòng ${task.round}`,`Trạng thái: ${task.status}\nWriter: ${task.writer}\nCheckout: ${task.workspace}\nSubmission: ${task.submissionId||'chưa có'}\nReviewed: ${task.reviewedSubmissionId||'chưa có'}`));const grid=document.createElement('div');grid.className='grid';grid.append(card('Antigravity',agentText(task.antigravity)),card('Codex',agentText(task.codex)));board.append(grid,card('Tiếp theo',task.nextAction),card('Cần bạn duyệt',JSON.stringify(task.needsPO,null,2)),card('Evidence',JSON.stringify(task.evidence,null,2)));document.getElementById('error').textContent='';document.getElementById('checked').textContent='Bảng tải lúc '+new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',dateStyle:'short',timeStyle:'medium'}).format(new Date())}catch(error){document.getElementById('error').textContent='Không đọc được trạng thái: '+error.message+' — mở bằng server loopback theo README, không dùng file://.'}}
document.getElementById('refresh').onclick=refresh;refresh();setInterval(refresh,10000);
</script></body></html>

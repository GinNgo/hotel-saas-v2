# ═══════════════════════════════════════════════════════
# Hotel SaaS Platform — CI Pipeline
# ═══════════════════════════════════════════════════════
# Triggers: push/PR to main, develop
# Stages: build → lint → test → security scan
# ═══════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

jobs:
  # ── Stage 1: Backend Build & Test ──
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel_saas_p1b01a_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=hotel_saas_p1b01a_test;Username=postgres;Password=postgres;Persist Security Info=true;Pooling=false;"
          HOTEL_SAAS_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=hotel_saas_p1b01a_test;Username=postgres;Password=postgres;Persist Security Info=true;Pooling=false;"
        run: dotnet test --no-build --configuration Release -m:1 --collect:"XPlat Code Coverage" --results-directory ./coverage -- RunConfiguration.DisableParallelization=true xunit.parallelizeAssembly=false xunit.parallelizeTestCollections=false xunit.maxParallelThreads=1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/**/coverage.cobertura.xml

  # ── Stage 2: Frontend Build & Test ──
  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build -- --configuration production

      - name: Unit tests
        run: npm test -- --watch=false

  # ── Stage 2b: Infrastructure & Compose Validation ──
  infra-validation:
    name: Infra & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configurations
        run: |
          docker compose -f docker-compose.staging.yml config --quiet
          docker compose -f deploy/docker-compose.staging.yml config --quiet
          docker compose -f docker/docker-compose.observability.yml config --quiet
          docker compose -f docker/docker-compose.full.yml config --quiet

      - name: Validate YAML & JSON configurations
        run: |
          ruby -ryaml -e '
            Dir.glob("{.github/workflows/*.yml,docker/**/*.yml}").each do |f|
              YAML.safe_load(File.read(f), aliases: true)
              puts "YAML OK: #{f}"
            end
          '
          python3 -c '
          import glob, json
          for f in glob.glob("docker/observability/grafana/**/*.json", recursive=True):
              with open(f, "r", encoding="utf-8") as fh:
                  json.load(fh)
              print(f"JSON OK: {f}")
          '

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate Terraform formatting and configuration
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false
          terraform validate

  # ── Stage 3: Security Scan ──
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 4: Build Status ──
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend, infra-validation, security]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.infra-validation.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "CI failed! (backend=${{ needs.backend.result }}, frontend=${{ needs.frontend.result }}, infra-validation=${{ needs.infra-validation.result }}, security=${{ needs.security.result }})"
            exit 1
          fi
          echo "All CI checks passed! ✅"

# ═══════════════════════════════════════════════════════════════════════════
# Hotel SaaS Platform v2 — Automated VPS Deployment Pipeline (CD + Rollback)
# ═══════════════════════════════════════════════════════════════════════════
# Quy trình chuẩn Enterprise:
#   - Khi push lên `develop`: Chạy Stage 1 (Isolation Gate) và Stage 2 (Build Test)
#     để bảo đảm code sạch, KHÔNG tác động tới VPS.
#   - Khi merge vào `main`: Tự động kích hoạt Stage 3 (Rolling Deploy lên VPS)
# ═══════════════════════════════════════════════════════════════════════════

name: CD — Deploy to Production VPS

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy or rollback to (e.g. latest or sha-a1b2c3d4e5f6)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ginngo/hotel-saas-backend
  FRONTEND_IMAGE: ghcr.io/ginngo/hotel-saas-frontend
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Stage 1: Automated Multi-Tenant Isolation Gate ──────────────────────
  isolation-gate:
    name: 1. Multi-Tenant & Branch Isolation Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel_saas_p1b01a_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Multi-Tenant, Cross-Branch, SignalR, VNPay & Observability Isolation Tests
        working-directory: backend
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=hotel_saas_p1b01a_test;Username=postgres;Password=postgres;Persist Security Info=true;Pooling=false;"
          HOTEL_SAAS_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=hotel_saas_p1b01a_test;Username=postgres;Password=postgres;Persist Security Info=true;Pooling=false;"
        run: |
          dotnet test HotelSaas.slnx \
            --configuration Release \
            -m:1 \
            --filter "FullyQualifiedName~CrossBranchSecurityE2ETests|FullyQualifiedName~MultiTenantSaaSRbacFlowTests|FullyQualifiedName~ObservabilityMetricsAndLoggingTests|FullyQualifiedName~MultiTenantBranchIsolationTests|FullyQualifiedName~TenantPropertyContextMiddlewareTests|FullyQualifiedName~NotificationHubSecurityTests|FullyQualifiedName~VnpayIntegrationTests" \
            --logger "trx;LogFileName=isolation-gate.trx" \
            -- RunConfiguration.DisableParallelization=true xunit.parallelizeAssembly=false xunit.parallelizeTestCollections=false xunit.maxParallelThreads=1

  # ── Stage 2: Build & Push Immutable Docker Images ──────────────────────
  build-and-push:
    name: 2. Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    needs: [isolation-gate]
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Immutable Image Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend (.NET 10 WebApi)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend (Angular 22 + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ── Stage 3: Deploy to VPS via Zero-Downtime Rolling Update ─────────────
  # CHỈ KÍCH HOẠT KHI MERGE VÀO NHÁNH MAIN HOẶC TRIGGER BẰNG TAY
  deploy-vps:
    name: 3. Rolling Deploy to VPS (Chỉ kích hoạt khi vào main)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Sync HotelSaaS Manifests to VPS (Non-Destructive)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "deploy/deploy.sh,docker/docker-compose.observability.yml,docker/observability"
          target: "/opt/hotel-saas"
          overwrite: true

      - name: Execute Rolling Update on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/hotel-saas
            chmod +x /opt/hotel-saas/deploy/deploy.sh

            echo "--- Container inventory BEFORE deploy ---"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            INPUT_TAG="$(printf '%s' "${{ inputs.image_tag }}" | tr -d '[:space:]')"
            BUILD_TAG="$(printf '%s' "${{ needs.build-and-push.outputs.image_tag }}" | tr -d '[:space:]')"
            IMAGE_TAG="${INPUT_TAG:-${BUILD_TAG:-latest}}"
            export IMAGE_TAG
            echo "Deploying IMAGE_TAG=${IMAGE_TAG}..."

            echo "[1/5] Authenticating Docker with GHCR on VPS..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            PREV_BACKEND_IMG=$(docker inspect --format='{{.Image}}' hotelsaas-backend-api 2>/dev/null || true)
            PREV_FRONTEND_IMG=$(docker inspect --format='{{.Image}}' hotelsaas-frontend-app 2>/dev/null || docker inspect --format='{{.Image}}' hotelsaas-frontend-spa 2>/dev/null || true)
            PREV_BACKEND_REF=$(docker inspect --format='{{.Config.Image}}' hotelsaas-backend-api 2>/dev/null || true)
            PREV_IMAGE_TAG="${PREV_BACKEND_REF##*:}"
            if [ -z "${PREV_IMAGE_TAG}" ] || [ "${PREV_IMAGE_TAG}" = "${PREV_BACKEND_REF}" ]; then
              PREV_IMAGE_TAG="latest"
            fi

            if [ -n "${PREV_BACKEND_IMG}" ] || [ -n "${PREV_FRONTEND_IMG}" ]; then
              {
                echo "PREV_BACKEND_IMG=${PREV_BACKEND_IMG}"
                echo "PREV_FRONTEND_IMG=${PREV_FRONTEND_IMG}"
                echo "PREV_IMAGE_TAG=${PREV_IMAGE_TAG}"
              } > /opt/hotel-saas/.rollback_state
              echo "Saved rollback snapshot (.rollback_state): tag=${PREV_IMAGE_TAG}"
            fi

            echo "[2/5] Pulling latest immutable images from GHCR (IMAGE_TAG=${IMAGE_TAG})..."
            docker compose -f docker-compose.staging.yml pull

            echo "[3/5] Gracefully rolling update backend & frontend containers..."
            docker compose -f docker-compose.staging.yml up -d --no-deps backend frontend

            echo "[4/5] Deploying observability stack (if present)..."
            if [ -f docker/docker-compose.observability.yml ]; then
              sed -i 's/hotelsaas-staging-network/treeseo-production_edge/g' /opt/hotel-saas/docker/docker-compose.observability.yml
              docker compose -f docker/docker-compose.observability.yml up -d
            fi

            echo "[5/5] Verifying /health and /health/ready probes..."
            HEALTHY=0
            for i in $(seq 1 20); do
              HEALTH_RES=$(curl -sk https://luxustay.duckdns.org/health || echo "")
              READY_RES=$(curl -sk https://luxustay.duckdns.org/health/ready || echo "")
              if echo "${HEALTH_RES}" | grep -q '"status":"healthy"' && echo "${READY_RES}" | grep -q '"status":"ready"'; then
                HEALTHY=1
                break
              fi
              echo "Waiting for health & readiness probes ($i/20)..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Health or readiness probe failed after 60 seconds!"
              docker logs --tail 80 hotelsaas-backend-api || true
              if [ -n "${PREV_BACKEND_IMG}" ] || [ -n "${PREV_FRONTEND_IMG}" ]; then
                echo "⏪ Attempting automatic rollback to previous images (prev_tag=${PREV_IMAGE_TAG}) onto IMAGE_TAG=${IMAGE_TAG}..."
                if [ -n "${PREV_BACKEND_IMG}" ]; then
                  docker tag "${PREV_BACKEND_IMG}" "ghcr.io/ginngo/hotel-saas-backend:${IMAGE_TAG}"
                fi
                if [ -n "${PREV_FRONTEND_IMG}" ]; then
                  docker tag "${PREV_FRONTEND_IMG}" "ghcr.io/ginngo/hotel-saas-frontend:${IMAGE_TAG}"
                fi
                docker compose -f docker-compose.staging.yml up -d --no-deps backend frontend
                echo "✅ Automatic rollback containers started for prev_tag=${PREV_IMAGE_TAG}."
              else
                echo "⚠️ No previous container images found for automatic rollback."
              fi
              echo "--- Container inventory AFTER failed deploy / rollback ---"
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              exit 1
            fi

            echo "--- Container inventory AFTER deploy ---"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "✅ Hotel SaaS Platform deployment verified and healthy (IMAGE_TAG=${IMAGE_TAG})!"

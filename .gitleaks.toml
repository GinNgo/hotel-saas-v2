[extend]
useDefault = true

[allowlist]
description = "Allowlist documentation samples, unit tests, local scripts, public Firebase Web client config, and UI sessionStorage keys"
paths = [
    '''docs/''',
    '''backend/tests/''',
    '''scripts/''',
    '''^frontend/src/environments/environment\.ts$''',
    '''^frontend/src/environments/environment\.development\.ts$'''
]
regexes = [
    '''hotelsaas_dismissed_banners_v1'''
]
